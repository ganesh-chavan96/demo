<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 1200px;
            background-color: aquamarine;
            margin: 70px 0px 0px 50px;
            display: grid;
            grid-template-columns: 200px 800px auto;
            grid-template-rows: 200px 200px auto;
            
            /* grid-row-gap: 10px;
            grid-column-gap: 10px; */
            grid-gap: 20px 20px;
        }

        .item{
            margin: 10px;
        }

        #item1{
            background-color: red;
        }

        #item2{
            background-color: blue;
        }

        #item3{
            background-color: pink;
        }

        #item4{
            background-color: orange;
        }

        #item5{
            background-color: brown;
        }

        #item6{
            background-color: lawngreen;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="item1">1st</div>
        <div class="item" id="item2">2nd</div>
        <div class="item" id="item3">3rd</div>
        <div class="item" id="item4">4th</div>
        <div class="item" id="item5">5th</div>
        <div class="item" id="item6">6th</div>
    </div>
</body>
</html>
