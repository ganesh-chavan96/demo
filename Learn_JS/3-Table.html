<!DOCTYPE html>
<html>
  <style type="text/css" media="all">
    table{
      border: 5px solid red;
      
    }
  </style>
<body>

<table border="1" cellpadding="8" cellspacing="0px">
<script>
var i = 1;

while (i <= 10) {
    document.write("<tr>");

    var j = 1;
    while (j <= 10) {
        document.write("<td>" + (j * i) + "</td>");
        j++;
    }

    document.write("</tr>");
    i++;
}
</script>
</table>

</body>
</html>
