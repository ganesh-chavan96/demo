<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <marquee behavior="" direction="" bgcolor="yellow">Hello World</marquee> <!-- by default right to left  -->
    <marquee behavior="" direction="right" bgcolor="lightgreen" >Hello World</marquee>
    <marquee height="200px" width="200px" bgcolor="red" behavior="slide" direction="down" >Hello World</marquee>
    <marquee height="200px" width="200px" bgcolor="red" behavior="scroll" direction="down" >Hello World</marquee>
    <marquee height="200px" width="200px" bgcolor="red" behavior="" direction="down"  scrollamount="15">Hello World</marquee>
    <marquee height="200px" width="200px" bgcolor="red" behavior="alternate" direction="down" scrollamount="10" >Hello World</marquee>

    <marquee behavior="" direction="up" loop="3">Hello World</marquee>
    
</body>
</html>
