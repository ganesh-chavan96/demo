
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Pricing</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css">

    <style>
        body {
            padding: 30px;
        }
    </style>
</head>

<body>

    <h3 class="text-primary">Ticket Pricing</h3>

    <label for="age">Enter Your Age :</label>
    <input type="number" id="age" min="0" required>

    <br><br>

    <button onclick="calculate()" class="btn btn-success">
        Calculate Ticket Price
    </button>

    <p id="category"></p>
    <p id="price"></p>

    <script>
        function calculate() {
            let age = Number(document.getElementById("age").value);
            let category = "";
            let price = 0;

            if (document.getElementById("age").value === "" ||
                age < 0 || !Number.isInteger(age)) {
                alert("Please enter a valid age.");
                return;
            }

            if (age < 5) {
                category = "Free Ticket";
                price = 0;
            }
            else if (age <= 17) {
                category = "Child Ticket";
                price = 100;
            }
            else if (age <= 59) {
                category = "Adult Ticket";
                price = 200;
            }
            else {
                category = "Senior Citizen Ticket";
                price = 120;
            }

            document.getElementById("category").innerHTML =
                "Ticket Category: " + category;

            document.getElementById("price").innerHTML =
                "Ticket Price: ₹" + price;
        }
    </script>

</body>
</html>
